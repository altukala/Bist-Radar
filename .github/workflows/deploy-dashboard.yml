name: BIST30 dashboard yayımla

on:
  workflow_dispatch:
  schedule:
    # Hafta içi 17:30 UTC = Türkiye saatiyle yaklaşık 20:30.
    - cron: "30 17 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projeyi al
        uses: actions/checkout@v6
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt
      - name: BIST30 dashboard oluştur
        env:
          BIST_RADAR_NO_BROWSER: "1"
        run: |
          python bist30_rapor.py
          python fon_tara.py
          python abd_firsat_tara.py
          mkdir -p site
          cp reports/BIST30-*.html site/bist30.html
          cp reports/tefas-fon-tarama-*.html site/fonlar.html
          cp reports/abd-firsat-tarama-*.html site/abd.html
          cp pages_index.html site/index.html
      - name: GitHub Pages'i yapılandır
        uses: actions/configure-pages@v5
      - name: Sayfayı yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Dashboard'u yayımla
        id: deployment
        uses: actions/deploy-pages@v4
